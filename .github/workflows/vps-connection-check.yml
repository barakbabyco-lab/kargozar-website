name: Kargozar VPS connection and DNS inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vps-connection-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in HOST USER KEY KNOWN_HOSTS; do
            test -n "${!v:-}" || { echo "::error::Missing SSH secret: $v"; exit 1; }
          done
          PORT="${PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/kargozar_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/kargozar_key ~/.ssh/known_hosts
          TARGET="$HOST"
          if [ "$PORT" != 22 ]; then TARGET="[$HOST]:$PORT"; fi
          ssh-keygen -F "$TARGET" -f ~/.ssh/known_hosts >/dev/null
          {
            echo "Host kargozar-vps"
            echo "  HostName $HOST"
            echo "  Port $PORT"
            echo "  User $USER"
            echo "  IdentityFile ~/.ssh/kargozar_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 15"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "=== ROOT SSH ACCESS TEST FROM RUNNER ==="
          ssh -o User=root -o BatchMode=yes -o ConnectTimeout=8 kargozar-vps 'id' 2>&1 || echo "Root SSH login is not available with the configured deployment key"

      - name: Inspect VPS and BIND DNS (read-only)
        shell: bash
        run: |
          set -euo pipefail
          ssh kargozar-vps 'bash -s' <<'REMOTE'
          set -u
          echo "=== SERVER ==="
          hostname
          . /etc/os-release && echo "$PRETTY_NAME"
          df -h /
          free -h

          echo "=== BIND SERVICE ==="
          if command -v named >/dev/null 2>&1; then
            named -V 2>&1 | head -n 2
          else
            echo "BIND named: NOT INSTALLED"
          fi
          systemctl is-active bind9 2>&1 || true
          systemctl status bind9 --no-pager -l 2>&1 | head -n 18 || true

          echo "=== BIND CONFIG VALIDATION ==="
          if command -v named-checkconf >/dev/null 2>&1; then
            named-checkconf -z 2>&1 || true
          else
            echo "named-checkconf: NOT INSTALLED"
          fi

          echo "=== DECLARED ZONE NAMES ==="
          if [ -d /etc/bind ]; then
            grep -RhoE 'zone[[:space:]]+"[^"]+"' /etc/bind --include='*.conf' 2>/dev/null | sort -u || true
            echo "BIND FILES:"
            find /etc/bind -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | sort | head -n 80
          fi

          echo "=== DNS LISTENERS ==="
          ss -lntup 2>&1 | grep -E '(:53[[:space:]]|:53$)' || echo "No listener found on port 53"

          echo "=== FIREWALL ==="
          if command -v ufw >/dev/null 2>&1; then ufw status 2>&1 || true; else echo "ufw: NOT INSTALLED"; fi

          echo "=== LOCAL DNS TEST: SOA ==="
          if command -v dig >/dev/null 2>&1; then
            dig @127.0.0.1 kargozarr.ir SOA +time=2 +tries=1 +noall +answer +comments
            echo "=== LOCAL DNS TEST: NS ==="
            dig @127.0.0.1 kargozarr.ir NS +time=2 +tries=1 +noall +answer +comments
          else
            echo "dig: NOT INSTALLED"
          fi
          echo "=== PUBLIC DNS RESOLVER CHECKS ==="
          if command -v dig >/dev/null 2>&1; then
            for type in NS SOA A AAAA MX TXT DS DNSKEY; do
              echo "--- Cloudflare resolver: $type ---"
              dig @1.1.1.1 kargozarr.ir "$type" +time=3 +tries=1 +noall +answer +comments || true
              echo "--- Google resolver: $type ---"
              dig @8.8.8.8 kargozarr.ir "$type" +time=3 +tries=1 +noall +answer +comments || true
            done
            echo "=== DNS DELEGATION TRACE ==="
            dig +trace kargozarr.ir NS +time=3 +tries=1 2>&1 | tail -n 100 || true
          fi

          echo "=== IR DOMAIN REGISTRATION LOOKUP ==="
          if command -v whois >/dev/null 2>&1; then
            whois kargozarr.ir 2>&1 | head -n 100 || true
          else
            echo "whois client not installed; no package installation performed"
          fi

          echo "=== DIRECT .IR AUTHORITATIVE REGISTRY DNS CHECK ==="
          if command -v dig >/dev/null 2>&1; then
            for server in a.nic.ir b.nic.ir c.nic.ir d.nic.ir; do
              echo "--- $server: NS delegation ---"
              dig @"$server" kargozarr.ir NS +norecurse +dnssec +time=3 +tries=1 +noall +answer +authority +comments || true
              echo "--- $server: DS ---"
              dig @"$server" kargozarr.ir DS +norecurse +dnssec +time=3 +tries=1 +noall +answer +authority +comments || true
            done
          fi

          echo "=== IRNIC WHOIS TCP QUERY ==="
          python3 - <<'PYWHOIS'
          import socket
          host = "whois.nic.ir"
          query = "kargozarr.ir\r\n"
          try:
              with socket.create_connection((host, 43), timeout=8) as sock:
                  sock.settimeout(8)
                  sock.sendall(query.encode("ascii"))
                  chunks = []
                  total = 0
                  while total < 12000:
                      try:
                          data = sock.recv(min(4096, 12000-total))
                      except socket.timeout:
                          break
                      if not data:
                          break
                      chunks.append(data)
                      total += len(data)
                  result = b"".join(chunks).decode("utf-8", errors="replace")
                  print(result if result.strip() else "WHOIS returned an empty response")
          except Exception as exc:
              print(f"WHOIS query failed: {type(exc).__name__}: {exc}")
          PYWHOIS

          echo "=== CURRENT IRNIC NAME SERVER CHECK ==="
          if command -v dig >/dev/null 2>&1; then
            for server in ns929.mihanwebhost.com ns930.mihanwebhost.com; do
              echo "--- $server SOA ---"
              dig @"$server" kargozarr.ir SOA +norecurse +time=4 +tries=1 +noall +answer +authority +comments || true
              echo "--- $server NS ---"
              dig @"$server" kargozarr.ir NS +norecurse +time=4 +tries=1 +noall +answer +authority +comments || true
              echo "--- $server apex A ---"
              dig @"$server" kargozarr.ir A +norecurse +time=4 +tries=1 +noall +answer +authority +comments || true
              echo "--- $server www A ---"
              dig @"$server" www.kargozarr.ir A +norecurse +time=4 +tries=1 +noall +answer +authority +comments || true
            done
          fi

          echo "=== VPS PRIVILEGE AND FIREWALL CAPABILITY ==="
          sudo -n -l 2>&1 | head -n 40 || true
          sudo -n ufw status verbose 2>&1 || true
          sudo -n nft list ruleset 2>&1 | head -n 100 || true
          sudo -n iptables -S 2>&1 | head -n 80 || true

          echo "=== BIND ACTIVE CONFIGURATION (NON-SECRET FILES ONLY) ==="
          for file in /etc/bind/named.conf.options /etc/bind/named.conf.local; do
            if [ -r "$file" ]; then
              echo "--- $file ---"
              sed -n '1,220p' "$file"
            fi
          done

          echo "=== VPS PUBLIC DNS PORT REACHABILITY SELF-CHECK ==="
          if command -v dig >/dev/null 2>&1; then
            dig @194.5.205.233 kargozarr.ir NS +norecurse +time=3 +tries=1 +noall +answer +comments || true
            dig @194.5.205.233 example.com A +time=3 +tries=1 +noall +answer +comments || true
          fi

          echo "=== ROOT SSH ACCESS CHECK (READ-ONLY) ==="
          ssh -o User=root -o BatchMode=yes -o ConnectTimeout=8 kargozar-vps 'id; printf "root SSH access confirmed\\n"' 2>&1 || echo "Root SSH login is not available with the configured deployment key"

          echo "=== END READ-ONLY INSPECTION ==="
          REMOTE
