name: Kargozar VPS connection and DNS inspection
# Read-only deployment access and DNS verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vps-connection-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in HOST USER KEY KNOWN_HOSTS; do
            test -n "${!v:-}" || { echo "::error::Missing SSH secret: $v"; exit 1; }
          done
          PORT="${PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/kargozar_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/kargozar_key ~/.ssh/known_hosts
          TARGET="$HOST"
          if [ "$PORT" != 22 ]; then TARGET="[$HOST]:$PORT"; fi
          ssh-keygen -F "$TARGET" -f ~/.ssh/known_hosts >/dev/null
          {
            echo "Host kargozar-vps"
            echo "  HostName $HOST"
            echo "  Port $PORT"
            echo "  User $USER"
            echo "  IdentityFile ~/.ssh/kargozar_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 15"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "=== ROOT SSH ACCESS TEST FROM RUNNER ==="
          ssh -o User=root -o BatchMode=yes -o ConnectTimeout=8 kargozar-vps 'id' 2>&1 || echo "Root SSH login is not available with the configured deployment key"


      - name: Export and optimize Kargozar mobile images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kargozar-png" mobile/assets/kargozar
          ssh kargozar-vps "cd /var/www/html/kargozar-assets/final && tar -czf - -- *.png" \
            | tar -xzf - -C "$RUNNER_TEMP/kargozar-png"
          count="$(find "$RUNNER_TEMP/kargozar-png" -maxdepth 1 -type f -name '*.png' | wc -l)"
          test "$count" -eq 24 || { echo "::error::Expected 24 PNG images; found $count"; exit 1; }
          python3 -m pip install --quiet Pillow
          python3 - "$RUNNER_TEMP/kargozar-png" mobile/assets/kargozar <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image, ImageOps

          source, target = Path(sys.argv[1]), Path(sys.argv[2])
          for path in sorted(source.glob("*.png")):
              with Image.open(path) as original:
                  image = ImageOps.exif_transpose(original)
                  limit = 1600 if path.name.startswith("banner-") else 1000
                  image.thumbnail((limit, limit), Image.Resampling.LANCZOS)
                  if image.mode not in ("RGB", "RGBA"):
                      image = image.convert("RGB")
                  image.save(target / (path.stem + ".webp"), "WEBP", quality=82, method=6)
          outputs = list(target.glob("*.webp"))
          print(f"Optimized {len(outputs)} images; total {sum(p.stat().st_size for p in outputs):,} bytes.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/kargozar/*.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Add optimized Kargozar mobile image assets"
            git push origin HEAD:main
          fi

      - name: Upload optimized Kargozar image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kargozar-mobile-webp-assets
          path: mobile/assets/kargozar/*.webp
          if-no-files-found: error
          retention-days: 14

      - name: Inspect VPS and BIND DNS (read-only)
        shell: bash
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh kargozar-vps 'bash -s' "$DEPLOY_PATH" <<'REMOTE'
          set -u
          deploy_path="${1:-}"
          echo "=== SERVER ==="
          hostname
          . /etc/os-release && echo "$PRETTY_NAME"
          df -h /
          free -h

          echo "=== BIND SERVICE ==="
          if command -v named >/dev/null 2>&1; then
            named -V 2>&1 | head -n 2
          else
            echo "BIND named: NOT INSTALLED"
          fi
          systemctl is-active bind9 2>&1 || true
          systemctl status bind9 --no-pager -l 2>&1 | head -n 18 || true

          echo "=== BIND CONFIG VALIDATION ==="
          if command -v named-checkconf >/dev/null 2>&1; then
            named-checkconf -z 2>&1 || true
          else
            echo "named-checkconf: NOT INSTALLED"
          fi

          echo "=== DECLARED ZONE NAMES ==="
          if [ -d /etc/bind ]; then
            grep -RhoE 'zone[[:space:]]+"[^"]+"' /etc/bind --include='*.conf' 2>/dev/null | sort -u || true
            echo "BIND FILES:"
            find /etc/bind -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | sort | head -n 80
          fi

          echo "=== DNS LISTENERS ==="
          ss -lntup 2>&1 | grep -E '(:53[[:space:]]|:53$)' || echo "No listener found on port 53"

          echo "=== FIREWALL ==="
          if command -v ufw >/dev/null 2>&1; then ufw status 2>&1 || true; else echo "ufw: NOT INSTALLED"; fi

          echo "=== LOCAL DNS TEST: SOA ==="
          if command -v dig >/dev/null 2>&1; then
            dig @127.0.0.1 kargozarr.ir SOA +time=2 +tries=1 +noall +answer +comments
            echo "=== LOCAL DNS TEST: NS ==="
            dig @127.0.0.1 kargozarr.ir NS +time=2 +tries=1 +noall +answer +comments
          else
            echo "dig: NOT INSTALLED"
          fi
          echo "=== PUBLIC DNS RESOLVER CHECKS ==="
          if command -v dig >/dev/null 2>&1; then
            for type in NS SOA A AAAA MX TXT DS DNSKEY; do
              echo "--- Cloudflare resolver: $type ---"
              dig @1.1.1.1 kargozarr.ir "$type" +time=3 +tries=1 +noall +answer +comments || true
              echo "--- Google resolver: $type ---"
              dig @8.8.8.8 kargozarr.ir "$type" +time=3 +tries=1 +noall +answer +comments || true
            done
            echo "=== DNS DELEGATION TRACE ==="
            dig +trace kargozarr.ir NS +time=3 +tries=1 2>&1 | tail -n 100 || true
          fi

          echo "=== IR DOMAIN REGISTRATION LOOKUP ==="
          if command -v whois >/dev/null 2>&1; then
            whois kargozarr.ir 2>&1 | head -n 100 || true
          else
            echo "whois client not installed; no package installation performed"
          fi

          echo "=== DIRECT .IR AUTHORITATIVE REGISTRY DNS CHECK ==="
          if command -v dig >/dev/null 2>&1; then
            for server in a.nic.ir b.nic.ir c.nic.ir d.nic.ir; do
              echo "--- $server: NS delegation ---"
              dig @"$server" kargozarr.ir NS +norecurse +dnssec +time=3 +tries=1 +noall +answer +authority +comments || true
              echo "--- $server: DS ---"
              dig @"$server" kargozarr.ir DS +norecurse +dnssec +time=3 +tries=1 +noall +answer +authority +comments || true
            done
          fi

          echo "=== IRNIC WHOIS TCP QUERY ==="
          python3 - <<'PYWHOIS'
          import socket
          host = "whois.nic.ir"
          query = "kargozarr.ir\r\n"
          try:
              with socket.create_connection((host, 43), timeout=8) as sock:
                  sock.settimeout(8)
                  sock.sendall(query.encode("ascii"))
                  chunks = []
                  total = 0
                  while total < 12000:
                      try:
                          data = sock.recv(min(4096, 12000-total))
                      except socket.timeout:
                          break
                      if not data:
                          break
                      chunks.append(data)
                      total += len(data)
                  result = b"".join(chunks).decode("utf-8", errors="replace")
                  print(result if result.strip() else "WHOIS returned an empty response")
          except Exception as exc:
              print(f"WHOIS query failed: {type(exc).__name__}: {exc}")
          PYWHOIS

          echo "=== CURRENT IRNIC NAME SERVER CHECK ==="
          if command -v dig >/dev/null 2>&1; then
            for server in ns929.mihanwebhost.com ns930.mihanwebhost.com; do
              echo "--- $server SOA ---"
              dig @"$server" kargozarr.ir SOA +norecurse +time=4 +tries=1 +noall +answer +authority +comments || true
              echo "--- $server NS ---"
              dig @"$server" kargozarr.ir NS +norecurse +time=4 +tries=1 +noall +answer +authority +comments || true
              echo "--- $server apex A ---"
              dig @"$server" kargozarr.ir A +norecurse +time=4 +tries=1 +noall +answer +authority +comments || true
              echo "--- $server www A ---"
              dig @"$server" www.kargozarr.ir A +norecurse +time=4 +tries=1 +noall +answer +authority +comments || true
            done
          fi

          echo "=== VPS PRIVILEGE AND FIREWALL CAPABILITY ==="
          sudo -n -l 2>&1 | head -n 40 || true
          sudo -n ufw status verbose 2>&1 || true
          sudo -n nft list ruleset 2>&1 | head -n 100 || true
          sudo -n iptables -S 2>&1 | head -n 80 || true

          echo "=== BIND ACTIVE CONFIGURATION (NON-SECRET FILES ONLY) ==="
          for file in /etc/bind/named.conf.options /etc/bind/named.conf.local; do
            if [ -r "$file" ]; then
              echo "--- $file ---"
              sed -n '1,220p' "$file"
            fi
          done

          echo "=== VPS PUBLIC DNS PORT REACHABILITY SELF-CHECK ==="
          if command -v dig >/dev/null 2>&1; then
            dig @194.5.205.233 kargozarr.ir NS +norecurse +time=3 +tries=1 +noall +answer +comments || true
            dig @194.5.205.233 example.com A +time=3 +tries=1 +noall +answer +comments || true
          fi

          echo "=== ROOT SSH ACCESS CHECK (READ-ONLY) ==="
          ssh -o User=root -o BatchMode=yes -o ConnectTimeout=8 kargozar-vps 'id; printf "root SSH access confirmed\\n"' 2>&1 || echo "Root SSH login is not available with the configured deployment key"

          echo "=== CURRENT DNS RECORD INVENTORY FROM MIHANWEBHOST ==="
          if command -v dig >/dev/null 2>&1; then
            for type in MX TXT CAA AAAA; do
              echo "--- kargozarr.ir $type ---"
              dig @ns929.mihanwebhost.com kargozarr.ir "$type" +norecurse +time=4 +tries=1 +noall +answer +authority +comments || true
            done
            for name in _dmarc mail smtp imap pop webmail autodiscover ftp; do
              echo "--- $name.kargozarr.ir A ---"
              dig @ns929.mihanwebhost.com "$name.kargozarr.ir" A +norecurse +time=3 +tries=1 +noall +answer +authority +comments || true
            done
            echo "=== ZONE TRANSFER PERMISSION CHECK ==="
            dig @ns929.mihanwebhost.com kargozarr.ir AXFR +time=5 +tries=1 2>&1 | head -n 80 || true
          fi

          echo "=== OLD WEB HOST HTTP RESPONSE CHECK ==="
          if command -v curl >/dev/null 2>&1; then
            curl -sSI --connect-timeout 5 --max-time 10 -H 'Host: kargozarr.ir' http://89.32.248.121/ 2>&1 | head -n 25 || true
            curl -skSI --connect-timeout 5 --max-time 10 --resolve kargozarr.ir:443:89.32.248.121 https://kargozarr.ir/ 2>&1 | head -n 25 || true
          fi

          echo "=== DEPLOYMENT ACCOUNT IDENTITY ==="
          whoami
          id
          groups
          getent group sudo 2>&1 || true

          echo "=== APPLICATION PATH AND RUNTIME CHECK ==="
          if [ -n "$deploy_path" ]; then
            for target in "$deploy_path" "$deploy_path/current" "$deploy_path/shared" "$deploy_path/releases"; do
              if [ -e "$target" ]; then
                stat -c 'PRESENT %F %U:%G %a' "$target" 2>/dev/null || true
              else
                echo "MISSING configured deployment target"
              fi
            done
            if [ -L "$deploy_path/current" ]; then
              readlink "$deploy_path/current"
              current="$(readlink -f "$deploy_path/current")"
              for file in artisan vendor/autoload.php public/index.php; do
                [ -f "$current/$file" ] && echo "PRESENT $file" || echo "MISSING $file"
              done
              [ -f "$deploy_path/shared/.env" ] && echo "PRESENT shared environment file (contents withheld)" || echo "MISSING shared environment file"
            fi
          else
            echo "DEPLOY_PATH is not configured"
          fi
          echo "=== KNOWN CPANEL APPLICATION ROOT ==="
          for target in /home/onnusrbl/apps/kargozar-api-new /home/onnusrbl/apps/kargozar-api-new/public; do
            [ -d "$target" ] && stat -c 'PRESENT %F %U:%G %a' "$target" || echo "MISSING known application path"
          done
          echo "=== PHP AND COMPOSER RUNTIME ==="
          php -v 2>&1 | head -n 2 || true
          composer --version 2>&1 | head -n 1 || true
          echo "=== WEB LISTENERS ==="
          ss -lntup 2>&1 | grep -E '(:80[[:space:]]|:443[[:space:]]|:8080[[:space:]]|:8443[[:space:]])' || true
          echo "=== LOCAL VHOST CHECKS ==="
          for host in kargozarr.ir barakmod.ir; do
            echo "--- $host on localhost HTTP ---"
            curl -sSI --connect-timeout 3 --max-time 5 -H "Host: $host" http://127.0.0.1/ 2>&1 | head -n 8 || true
          done
          echo "=== BIND KARGOZARR ZONE FILE ==="
          if [ -r /etc/bind/db.kargozarr.ir ]; then sed -n '1,180p' /etc/bind/db.kargozarr.ir; else echo "Zone file is not readable by deployment user"; fi
          echo "=== BARAKMOD DNS RECORDS ON MIHANWEBHOST ==="
          if command -v dig >/dev/null 2>&1; then
            for type in NS A AAAA MX TXT; do
              echo "--- barakmod.ir $type ---"
              dig @ns553.mihanwebhost.com barakmod.ir "$type" +norecurse +time=3 +tries=1 +noall +answer +authority +comments || true
            done
            echo "--- barakmod.ir public A ---"
            dig @1.1.1.1 barakmod.ir A +time=3 +tries=1 +noall +answer +comments || true
          fi
          echo "=== KARGOZAR IMAGE ASSET DIRECTORY ==="
          if [ -d /var/www/html/kargozar-assets/final ]; then
            du -sh /var/www/html/kargozar-assets/final 2>/dev/null || true
            find /var/www/html/kargozar-assets/final -maxdepth 1 -type f -printf '%f %s bytes\\n' 2>/dev/null | sort | head -n 80
          else
            echo "Expected image asset directory is not present on this server"
          fi
          echo "=== NGINX VIRTUAL HOST INVENTORY ==="
          if [ -d /etc/nginx/sites-enabled ]; then
            for file in /etc/nginx/sites-enabled/*; do
              [ -f "$file" ] || continue
              echo "--- $(basename "$file") ---"
              grep -E '^[[:space:]]*(listen|server_name|root|proxy_pass)[[:space:]]' "$file" 2>/dev/null | head -n 30 || true
            done
          fi
          echo "=== PUBLIC BARAKMOD WOOCOMMERCE PAGE STATUS ==="
          if command -v curl >/dev/null 2>&1; then
            for path in / /shop/ /cart/ /checkout/; do
              printf '%s ' "$path"
              curl -skS -o /dev/null -w '%{http_code} %{content_type}\\n' --connect-timeout 5 --max-time 10 --resolve barakmod.ir:443:89.32.248.121 "https://barakmod.ir$path" || true
            done
          fi
          echo "=== BARAKMOD TEMPORARY CART AND CHECKOUT DIAGNOSTIC (NO ORDER SUBMITTED) ==="
          if command -v curl >/dev/null 2>&1; then
            test_dir="$(mktemp -d)"
            cookie_jar="$test_dir/cookies.txt"
            touch "$cookie_jar"
            user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
            echo "--- Add one in-stock product to an isolated temporary cart (simple product 200) ---"
            curl -k -sS -L --max-redirs 10 --connect-timeout 8 --max-time 35 \
              -A "$user_agent" -c "$cookie_jar" -b "$cookie_jar" \
              -o "$test_dir/add.html" -w 'add_to_cart_http=%{http_code} final_url=%{url_effective}\\n' \
              'https://barakmod.ir/?add-to-cart=200' || true
            echo "--- Cart page ---"
            curl -k -sS -L --max-redirs 10 --connect-timeout 8 --max-time 35 \
              -A "$user_agent" -c "$cookie_jar" -b "$cookie_jar" \
              -o "$test_dir/cart.html" -w 'cart_http=%{http_code} final_url=%{url_effective}\\n' \
              'https://barakmod.ir/cart/' || true
            echo "cart_has_product=$(grep -Eqi 'product-200|شومیز زنانه آریا' "$test_dir/cart.html" && echo yes || echo no)"
            echo "--- Checkout page ---"
            curl -k -sS -L --max-redirs 10 --connect-timeout 8 --max-time 35 \
              -A "$user_agent" -c "$cookie_jar" -b "$cookie_jar" \
              -o "$test_dir/checkout.html" -w 'checkout_http=%{http_code} final_url=%{url_effective}\\n' \
              'https://barakmod.ir/checkout/' || true
            echo "checkout_form=$(grep -qi 'woocommerce-checkout' "$test_dir/checkout.html" && echo present || echo missing)"
            echo "place_order_button=$(grep -qi 'place_order' "$test_dir/checkout.html" && echo present || echo missing)"
            echo "payment_gateway_ids:"
            grep -Eo 'payment_method_[A-Za-z0-9_]+' "$test_dir/checkout.html" | sort -u | head -n 20 || true
            echo "checkout_redirect_notice:"
            grep -Eo 'woocommerce-error[^>]*>[^<]+' "$test_dir/checkout.html" | head -n 5 || true
            rm -rf "$test_dir"
          fi
          echo "=== END READ-ONLY INSPECTION ==="
          REMOTE
