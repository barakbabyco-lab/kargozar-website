name: Kargozar VPS connection check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in HOST USER KEY KNOWN_HOSTS; do
            test -n "${!v:-}" || { echo "::error::Missing SSH secret: $v"; exit 1; }
          done
          PORT="${PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/kargozar_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/kargozar_key ~/.ssh/known_hosts
          TARGET="$HOST"
          if [ "$PORT" != 22 ]; then TARGET="[$HOST]:$PORT"; fi
          ssh-keygen -F "$TARGET" -f ~/.ssh/known_hosts >/dev/null
          {
            echo "Host kargozar-vps"
            echo "  HostName $HOST"
            echo "  Port $PORT"
            echo "  User $USER"
            echo "  IdentityFile ~/.ssh/kargozar_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 15"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Connect and inspect VPS (read-only)
        run: |
          set -euo pipefail
          ssh kargozar-vps 'bash -s' <<'REMOTE'
          set -eu
          echo "=== SSH CONNECTED ==="
          echo "HOST: $(hostname)"
          echo "OS: $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "KERNEL: $(uname -r)"
          echo "USER: $(id)"
          echo "DISK:"
          df -h /
          echo "MEMORY:"
          free -h
          echo "SOFTWARE:"
          for c in php composer nginx mysql mariadb git rsync; do
            if command -v "$c" >/dev/null 2>&1; then
              printf '%s: ' "$c"
              case "$c" in
                php) php -v | head -n 1 ;;
                composer) composer --version --no-ansi | head -n 1 ;;
                nginx) nginx -v 2>&1 ;;
                mysql|mariadb) "$c" --version | head -n 1 ;;
                *) command -v "$c" ;;
              esac
            else
              echo "$c: MISSING"
            fi
          done
          echo "=== END CHECK ==="
          REMOTE
