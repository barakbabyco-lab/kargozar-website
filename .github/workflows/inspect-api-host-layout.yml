name: Inspect API host layout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare approved SSH access
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing secret $name"; exit 1; }
          done
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 "$RUNNER_TEMP/kargozar-ssh"
          key="$RUNNER_TEMP/kargozar-ssh/id_key"
          if [[ "$DEPLOY_SSH_KEY" == *"-----BEGIN OPENSSH PRIVATE KEY-----"* || "$DEPLOY_SSH_KEY" == *"-----BEGIN RSA PRIVATE KEY-----"* || "$DEPLOY_SSH_KEY" == *"-----BEGIN EC PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d '[:space:]' | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          fp="$(ssh-keygen -y -f "$key" 2>/dev/null | ssh-keygen -lf - | awk '{print $2}')"
          case "$fp" in
            SHA256:yZ0PY2OlUFSszk6GcX9R9DxA/ZWVFBQ8ecRpFBJz4NA|SHA256:5UUGhIltNpKwHnvln4NThvqhHUQ6O3ntmMuvS1Uiun4|SHA256:uT3cxt86sX2DOP7sI7Ku67r39Qsrwlx5SylBxoaW9Hw|SHA256:ZufQ/zpxkVWSj1pNE77vnLATiWfvyAT+1ZSzruClE48) ;;
            *) echo "::error::Unapproved SSH key"; exit 1 ;;
          esac
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          hostkey="$DEPLOY_HOST"; [[ "$DEPLOY_PORT" == 22 ]] || hostkey="[$DEPLOY_HOST]:$DEPLOY_PORT"
          ssh-keygen -F "$hostkey" -f "$RUNNER_TEMP/kargozar-ssh/known_hosts" >/dev/null
          cat > "$RUNNER_TEMP/kargozar-ssh/config" <<EOF
          Host staging
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile $key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $RUNNER_TEMP/kargozar-ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/config"
      - name: Inspect Nginx site layout and Laravel release paths
        shell: bash
        env:
          SSH_CONFIG: ${{ runner.temp }}/kargozar-ssh/config
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" staging 'bash -s' <<'REMOTE'
          set +e
          echo "=== Nginx enabled sites ==="
          ls -la /etc/nginx/sites-enabled 2>&1
          echo
          echo "=== Nginx server block routing directives ==="
          sudo -n nginx -T 2>/dev/null | awk '
            /server[[:space:]]*\{/ { active=1; depth=0; block="" }
            active {
              block=block $0 "\n"
              opens=gsub(/\{/, "{"); closes=gsub(/\}/, "}")
              depth += opens-closes
              if (depth==0) {
                if (block ~ /server_name/) {
                  print block | "grep -E \"^# configuration file|^[[:space:]]*(server_name|listen|root|index|try_files|fastcgi_pass|include)[[:space:]]\""
                  close("grep -E \"^# configuration file|^[[:space:]]*(server_name|listen|root|index|try_files|fastcgi_pass|include)[[:space:]]\"")
                }
                active=0; block=""
              }
            }'
          echo
          echo "=== Laravel staging paths ==="
          for p in /var/www/kargozar-staging /var/www/kargozar-staging/current /var/www/kargozar-staging/current/public /var/www/kargozar-staging/releases; do
            if [ -e "$p" ]; then ls -ld "$p"; readlink -f "$p"; else echo "MISSING $p"; fi
          done
          echo
          echo "=== PHP and Certbot package availability ==="
          ls -l /run/php/php8.3-fpm.sock 2>&1
          command -v certbot
          certbot --version 2>&1
          dpkg-query -W -f='${Status} ${Version}\n' python3-certbot-nginx 2>&1
          apt-cache policy python3-certbot-nginx 2>/dev/null | head -12
          echo
          echo "=== Current API host local routes ==="
          curl --max-time 8 -sS -o /dev/null -w 'API_ROOT_HTTP=%{http_code}\n' -H 'Host: api.barakmod.ir' http://127.0.0.1/
          curl --max-time 8 -sS -o /dev/null -w 'API_SERVICES_HTTP=%{http_code}\n' -H 'Host: api.barakmod.ir' http://127.0.0.1/api/v1/services
          REMOTE