name: Bootstrap official Laravel backend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, session, tokenizer, xml, pdo_sqlite

      - name: Create official Laravel 13 application
        if: ${{ !hashFiles('backend/composer.json') }}
        run: composer create-project laravel/laravel backend "^13.0" --no-interaction --prefer-dist

      - name: Install Sanctum API foundation
        if: ${{ hashFiles('backend/composer.json') }}
        working-directory: backend
        run: |
          if ! composer show laravel/sanctum >/dev/null 2>&1; then
            composer require laravel/sanctum --no-interaction
          fi
          if [ ! -f routes/api.php ]; then
            php artisan install:api --no-interaction
          fi

      - name: Validate Composer project
        working-directory: backend
        run: composer validate --strict

      - name: Commit generated official framework skeleton
        run: |
          if [ -f backend/composer.json ] && ! git ls-files --error-unmatch backend/composer.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend
            git commit -m "Bootstrap official Laravel 13 API backend"
            git push origin HEAD:main
          else
            echo "Laravel backend already exists in the repository; no bootstrap commit required."
          fi
