name: Manage search service on staging VPS

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Choose the VPS operation"
        required: true
        type: choice
        options:
          - diagnose
          - diagnose-proxy
          - install
          - test
          - secure-proxy
        default: diagnose

permissions:
  contents: read

jobs:
  search-vps:
    name: Run selected search service operation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare verified SSH connection
        id: prepare
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          if ! [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "::error::DEPLOY_HOST must be an IP address or DNS hostname."
            exit 1
          fi
          if ! [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]]; then
            echo "::error::DEPLOY_USER is not a valid restricted Unix username."
            exit 1
          fi
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          if ! [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "::error::DEPLOY_PORT must be a valid TCP port."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/kargozar-ssh"
          # Normalize and validate either raw or Base64-encoded SSH private keys.
          key_file="$RUNNER_TEMP/kargozar-ssh/id_ed25519"
          if [[ "$DEPLOY_SSH_KEY" == *"-----BEGIN OPENSSH PRIVATE KEY-----"* || "$DEPLOY_SSH_KEY" == *"-----BEGIN RSA PRIVATE KEY-----"* || "$DEPLOY_SSH_KEY" == *"-----BEGIN EC PRIVATE KEY-----"* ]]; then
            key_format="raw"
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$key_file"
          else
            key_format="base64"
            if ! printf '%s' "$DEPLOY_SSH_KEY" | tr -d '[:space:]' | base64 --decode > "$key_file" 2>/dev/null; then
              echo "::error::VPS_SSH_KEY is neither a valid raw private key nor valid Base64."
              exit 1
            fi
          fi
          chmod 600 "$key_file"
          key_bytes="$(wc -c < "$key_file" | tr -d ' ')"
          key_lines="$(wc -l < "$key_file" | tr -d ' ')"
          has_begin="no"; has_end="no"
          grep -q -- '-----BEGIN .*PRIVATE KEY-----' "$key_file" && has_begin="yes" || true
          grep -q -- '-----END .*PRIVATE KEY-----' "$key_file" && has_end="yes" || true
          echo "SSH key input format: $key_format"
          echo "Decoded key metadata: bytes=$key_bytes lines=$key_lines begin_marker=$has_begin end_marker=$has_end"
          if ! public_key="$(ssh-keygen -y -f "$key_file" 2>/dev/null)"; then
            echo "::error::Decoded SSH key is not parseable. Check that VPS_SSH_KEY contains the complete Base64 output of the intended private-key file."
            exit 1
          fi
          printf '%s\n' "$public_key" > "$key_file.pub"
          key_fingerprint="$(ssh-keygen -lf "$key_file.pub" | awk '{print $2}')"
          echo "Validated SSH public-key fingerprint: $key_fingerprint"
          case "$key_fingerprint" in
            SHA256:yZ0PY2OlUFSszk6GcX9R9DxA/ZWVFBQ8ecRpFBJz4NA|SHA256:5UUGhIltNpKwHnvln4NThvqhHUQ6O3ntmMuvS1Uiun4|SHA256:uT3cxt86sX2DOP7sI7Ku67r39Qsrwlx5SylBxoaW9Hw|SHA256:ZufQ/zpxkVWSj1pNE77vnLATiWfvyAT+1ZSzruClE48)
              echo "SSH key fingerprint matches a public key installed on the VPS."
              ;;
            *)
              echo "::error::SSH key is valid but its fingerprint does not match any of the four deployment keys installed on the VPS."
              exit 1
              ;;
          esac
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/id_ed25519" "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          known_hosts_target="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != "22" ]]; then known_hosts_target="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          matched_keys="$(ssh-keygen -F "$known_hosts_target" -f "$RUNNER_TEMP/kargozar-ssh/known_hosts" | awk '!/^#/ && NF >= 3 {print $2}' | sort -u)"
          if [[ -z "$matched_keys" ]]; then
            echo "::error::No matching pre-verified host key in DEPLOY_KNOWN_HOSTS."
            exit 1
          fi
          # Offer only algorithms represented by the pre-verified known_hosts entries.
          host_key_algorithms=""
          while IFS= read -r key_type; do
            case "$key_type" in
              ssh-ed25519|ecdsa-sha2-*|sk-ssh-ed25519@openssh.com|sk-ecdsa-sha2-*) host_key_algorithms="${host_key_algorithms:+$host_key_algorithms,}$key_type" ;;
              ssh-rsa) host_key_algorithms="${host_key_algorithms:+$host_key_algorithms,}rsa-sha2-512,rsa-sha2-256,ssh-rsa" ;;
            esac
          done <<< "$matched_keys"
          if [[ -z "$host_key_algorithms" ]]; then
            echo "::error::DEPLOY_KNOWN_HOSTS contains no supported SSH host-key algorithm."
            exit 1
          fi
          cat > "$RUNNER_TEMP/kargozar-ssh/config" <<EOF
          Host kargozar-staging
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile $RUNNER_TEMP/kargozar-ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            HostKeyAlgorithms $host_key_algorithms
            UserKnownHostsFile $RUNNER_TEMP/kargozar-ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/config"
          echo "ssh_config=$RUNNER_TEMP/kargozar-ssh/config" >> "$GITHUB_OUTPUT"

      - name: Execute selected operation on VPS
        shell: bash
        env:
          SSH_CONFIG: ${{ steps.prepare.outputs.ssh_config }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          case "$TASK" in
            diagnose|diagnose-proxy|install|test|secure-proxy) ;;
            *) echo "::error::Unsupported task."; exit 1 ;;
          esac
          ssh -F "$SSH_CONFIG" kargozar-staging "bash -s -- '$TASK'" <<'REMOTE'
          set -euo pipefail
          task="$1"

          # Use Docker directly for root, otherwise require non-interactive sudo.
          if [[ "$(id -u)" -eq 0 ]]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
            SUDO="sudo -n"
          else
            echo "ERROR: SSH user needs root or passwordless sudo access to Docker."
            exit 1
          fi

          if [[ "$task" == "diagnose" ]]; then
            echo "=== OS and resources ==="
            ( . /etc/os-release 2>/dev/null && printf '%s %s\\n' "$PRETTY_NAME" "$VERSION_ID" ) || true
            uname -srmo
            df -h /
            free -h 2>/dev/null || true
            echo "=== Docker ==="
            command -v docker >/dev/null 2>&1 && docker --version || true
            $SUDO docker compose version
            $SUDO docker info --format 'Docker daemon: {{.ServerVersion}}'
            $SUDO docker ps --format 'container={{.Names}} image={{.Image}} status={{.Status}} ports={{.Ports}}'
            echo "=== Relevant listeners ==="
            if command -v ss >/dev/null 2>&1; then ss -lnt 2>/dev/null | awk 'NR==1 || /:8080[[:space:]]|:8888[[:space:]]|:80[[:space:]]|:443[[:space:]]/'; fi
            echo "=== Search service directory ==="
            if [[ -d /opt/kargozar-searxng ]]; then
              echo "SearXNG directory exists."
              $SUDO docker compose -f /opt/kargozar-searxng/compose.yml ps 2>&1 || true
            else
              echo "SearXNG directory does not exist."
            fi
            echo "=== Upstream HTTPS probes ==="
            for url in 'https://html.duckduckgo.com/html/?q=kargozar+connectivity+test' 'https://www.google.com/search?q=kargozar+connectivity+test' 'https://www.bing.com/search?q=kargozar+connectivity+test' 'https://search.brave.com/search?q=kargozar+connectivity+test'; do
              printf '%s -> ' "${url%%\\?*}"
              curl -L -sS -o /dev/null --connect-timeout 4 --max-time 8 -w 'HTTP %{http_code}; time=%{time_total}s\\n' "$url" || true
            done
            exit 0
          fi

          if [[ "$task" == "diagnose-proxy" ]]; then
            echo "=== Proxy diagnostic: read-only ==="
            echo "=== Hostname and OS ==="
            hostnamectl --static 2>/dev/null || hostname
            . /etc/os-release 2>/dev/null && echo "$PRETTY_NAME"
            echo "=== Listener ownership (80/443/8080/8888) ==="
            $SUDO ss -lntp 2>/dev/null | awk 'NR==1 || /:80[[:space:]]|:443[[:space:]]|:8080[[:space:]]|:8888[[:space:]]/'
            echo "=== Processes bound to relevant ports ==="
            if command -v fuser >/dev/null 2>&1; then
              for port in 80 443 8080 8888; do
                printf 'port %s: ' "$port"
                $SUDO fuser -n tcp "$port" 2>/dev/null || true
              done
            fi
            echo "=== Nginx binary and service ==="
            if command -v nginx >/dev/null 2>&1; then
              nginx -v 2>&1 || true
              $SUDO nginx -t 2>&1 || true
              echo "--- filtered active nginx configuration ---"
              $SUDO nginx -T 2>&1 | grep -E '(^# configuration file|^[[:space:]]*listen[[:space:]]|^[[:space:]]*server_name[[:space:]]|^[[:space:]]*ssl_certificate(_key)?[[:space:]]|^[[:space:]]*proxy_pass[[:space:]]|^[[:space:]]*access_log[[:space:]]|^[[:space:]]*error_log[[:space:]]|^[[:space:]]*include[[:space:]])' | head -n 240 || true
            else
              echo "nginx binary not found"
            fi
            echo "=== Web service units ==="
            for unit in nginx apache2 httpd caddy; do
              if systemctl list-unit-files "$unit.service" --no-legend 2>/dev/null | grep -q "$unit.service"; then
                printf '%s: ' "$unit"
                systemctl is-active "$unit.service" 2>/dev/null || true
              fi
            done
            echo "=== Enabled nginx site links ==="
            for dir in /etc/nginx/sites-enabled /etc/nginx/conf.d; do
              if [[ -d "$dir" ]]; then
                echo "--- $dir ---"
                $SUDO find "$dir" -maxdepth 1 -type f -o -type l 2>/dev/null | sort | head -n 100
              fi
            done
            echo "=== TLS certificate inventory (metadata only) ==="
            if command -v certbot >/dev/null 2>&1; then
              $SUDO certbot certificates 2>&1 | grep -E '^(  Certificate Name:|    Domains:|    Expiry Date:|    Certificate Path:|    Private Key Path:)' || true
            else
              echo "certbot not installed"
            fi
            echo "=== Certificate files for search.barakmod.ir (metadata only) ==="
            for cert in /etc/letsencrypt/live/search.barakmod.ir/fullchain.pem /etc/ssl/certs/search.barakmod.ir.crt; do
              if [[ -r "$cert" ]]; then
                openssl x509 -in "$cert" -noout -subject -issuer -dates 2>/dev/null || true
              fi
            done
            echo "=== Docker containers (names, status, ports only) ==="
            $SUDO docker ps --format 'container={{.Names}} status={{.Status}} ports={{.Ports}}'
            echo "Proxy diagnostic completed; no configuration was changed."
            exit 0
          fi

          if [[ "$task" == "secure-proxy" ]]; then
            domain="search.barakmod.ir"
            if [[ "$(id -u)" -ne 0 ]]; then
              echo "ERROR: secure-proxy requires a root SSH user."
              exit 1
            fi
            if ! command -v nginx >/dev/null 2>&1 || ! nginx -t >/dev/null 2>&1; then
              echo "ERROR: Nginx is missing or its current configuration is invalid; refusing changes."
              exit 1
            fi
            if ! curl -fsS --max-time 5 'http://127.0.0.1:8888/search?q=preflight&format=json' -o /dev/null; then
              echo "ERROR: SearXNG loopback health check failed; refusing changes."
              exit 1
            fi
            if ! ss -lnt 2>/dev/null | grep -Eq '(^|[[:space:]])0\.0\.0\.0:80|\\*:80|\\[::\\]:80'; then
              echo "ERROR: No public HTTP listener detected on port 80."
              exit 1
            fi
            if ss -lnt 2>/dev/null | grep -Eq '0\.0\.0\.0:443|\\*:443|\\[::\\]:443'; then
              echo "ERROR: Port 443 already has a listener; refusing to alter an existing TLS service."
              exit 1
            fi
            if [[ -e /etc/nginx/sites-enabled/search.barakmod.ir || -e /etc/nginx/sites-available/search.barakmod.ir ]]; then
              echo "ERROR: A search.barakmod.ir Nginx site already exists; refusing to overwrite it."
              exit 1
            fi
            if nginx -T 2>/dev/null | grep -qE 'server_name[[:space:]]+[^;]*search\.barakmod\.ir'; then
              echo "ERROR: An existing Nginx server block already claims search.barakmod.ir."
              exit 1
            fi
            if [[ ! -d /var/www/html ]]; then
              echo "ERROR: Expected webroot /var/www/html is missing."
              exit 1
            fi
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y certbot
            install -d -m 755 /var/www/html/.well-known/acme-challenge
            cat > /etc/nginx/sites-available/search.barakmod.ir <<'HTTP'
          server {
              listen 80;
              listen [::]:80;
              server_name search.barakmod.ir;
              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/html;
                  default_type "text/plain";
                  try_files $uri =404;
              }
              location / { return 404; }
          }
          HTTP
            ln -s /etc/nginx/sites-available/search.barakmod.ir /etc/nginx/sites-enabled/search.barakmod.ir
            nginx -t
            systemctl reload nginx
            certbot certonly --webroot -w /var/www/html -d "$domain" --non-interactive --agree-tos --register-unsafely-without-email
            test -s "/etc/letsencrypt/live/$domain/fullchain.pem"
            test -s "/etc/letsencrypt/live/$domain/privkey.pem"
            install -d -m 700 -o root -g root /etc/nginx/searxng
            token="$(openssl rand -hex 32)"
            printf '"Bearer %s" 1;\n' "$token" > /etc/nginx/searxng/token.map
            unset token
            chown root:root /etc/nginx/searxng/token.map
            chmod 600 /etc/nginx/searxng/token.map
            cat > /etc/nginx/conf.d/searxng-auth.conf <<'MAP'
          map $http_authorization $searxng_authorized {
              default 0;
              include /etc/nginx/searxng/token.map;
          }
          limit_req_zone $binary_remote_addr zone=searxng_search:10m rate=10r/s;
          MAP
            chown root:root /etc/nginx/conf.d/searxng-auth.conf
            chmod 600 /etc/nginx/conf.d/searxng-auth.conf
            cat > /etc/nginx/sites-available/search.barakmod.ir <<'TLS'
          server {
              listen 80;
              listen [::]:80;
              server_name search.barakmod.ir;
              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/html;
                  default_type "text/plain";
                  try_files $uri =404;
              }
              location / { return 301 https://$host$request_uri; }
          }
          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              server_name search.barakmod.ir;
              ssl_certificate /etc/letsencrypt/live/search.barakmod.ir/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/search.barakmod.ir/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              access_log /var/log/nginx/search.barakmod.ir.access.log;
              error_log /var/log/nginx/search.barakmod.ir.error.log warn;
              location = /search {
                  limit_req zone=searxng_search burst=20 nodelay;
                  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
                  if ($searxng_authorized = 0) { return 401; }
                  proxy_pass http://127.0.0.1:8888;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 30s;
              }
              location / { return 404; }
          }
          TLS
            nginx -t
            systemctl reload nginx
            if ! certbot renew --dry-run; then
              echo "ERROR: TLS renewal dry-run failed; inspect Certbot configuration."
              exit 1
            fi
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$domain/search?q=health&format=json" || true)"
            if [[ "$code" != "401" ]]; then
              echo "ERROR: Unauthenticated endpoint did not return HTTP 401 (got $code)."
              exit 1
            fi
            root_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$domain/" || true)"
            if [[ "$root_code" != "404" ]]; then
              echo "ERROR: Non-search paths are not closed (root returned $root_code)."
              exit 1
            fi
            echo "Secure HTTPS reverse proxy configured. /search requires a new random Bearer token; token value was not printed."
            echo "The token is stored root-only at /etc/nginx/searxng/token.map."
            exit 0
          fi

          if ! command -v curl >/dev/null 2>&1; then
            echo "ERROR: curl is required on the VPS."
            exit 1
          fi
          $SUDO docker compose version >/dev/null
          if [[ "$task" == "install" ]]; then
            if $SUDO ss -lnt 2>/dev/null | grep -Eq '127\.0\.0\.1:8888|0\.0\.0\.0:8888|\\*:8888'; then
              if ! $SUDO docker ps --format '{{.Names}} {{.Ports}}' | grep -q 'kargozar-searxng'; then
                echo "ERROR: Host port 8888 is already in use by another service; refusing to continue."
                exit 1
              fi
            fi
            $SUDO install -d -m 700 -o root -g root /opt/kargozar-searxng
            secret="$($SUDO sh -c 'umask 077; openssl rand -hex 32')"
            if [[ -z "$secret" || "${#secret}" -lt 32 ]]; then
              echo "ERROR: Could not generate SearXNG secret."
              exit 1
            fi
            $SUDO tee /opt/kargozar-searxng/settings.yml >/dev/null <<SETTINGS
          use_default_settings: true
          server:
            secret_key: "$secret"
            bind_address: "0.0.0.0"
            port: 8080
          search:
            formats:
              - html
              - json
          SETTINGS
            unset secret
            $SUDO chmod 600 /opt/kargozar-searxng/settings.yml
            $SUDO tee /opt/kargozar-searxng/compose.yml >/dev/null <<'COMPOSE'
          services:
            searxng:
              image: ghcr.io/searxng/searxng:2026.11.13-8a53a6aa5
              container_name: kargozar-searxng
              restart: unless-stopped
              ports:
                - "127.0.0.1:8888:8080"
              volumes:
                - ./settings.yml:/etc/searxng/settings.yml:ro
              environment:
                - SEARXNG_BASE_URL=http://localhost/
              mem_limit: 1g
              cpus: 1.0
          COMPOSE
            $SUDO chmod 600 /opt/kargozar-searxng/compose.yml
            cd /opt/kargozar-searxng
            $SUDO docker compose -f compose.yml pull
            $SUDO docker compose -f compose.yml up -d
          fi

          echo "=== SearXNG loopback health and JSON test ==="
          ok=0
          for attempt in $(seq 1 24); do
            if curl --silent --show-error --fail --max-time 5 'http://127.0.0.1:8888/search?q=kargozar+connectivity+test&format=json' -o /tmp/kargozar-searxng-test.json 2>/dev/null; then
              if python3 -c 'import json; d=json.load(open("/tmp/kargozar-searxng-test.json")); assert isinstance(d.get("results"), list)' 2>/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "ERROR: SearXNG did not return valid JSON on 127.0.0.1:8888."
            $SUDO docker logs --tail 80 kargozar-searxng 2>&1 || true
            rm -f /tmp/kargozar-searxng-test.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/kargozar-searxng-test.json"))
          print("HTTP JSON response: valid")
          print("Result count:", len(d.get("results", [])))
          print("Service URL: http://127.0.0.1:8888")
          PY
          rm -f /tmp/kargozar-searxng-test.json
          echo "SearXNG task completed successfully."
          REMOTE
