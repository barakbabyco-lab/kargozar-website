name: Verify Kargozar API and SSL
on:
  push:
    paths:
      - ".github/workflows/verify-api-ssl.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing secret $name"; exit 1; }
          done
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 "$RUNNER_TEMP/kargozar-ssh"
          key="$RUNNER_TEMP/kargozar-ssh/id_key"
          if [[ "$DEPLOY_SSH_KEY" == *"-----BEGIN OPENSSH PRIVATE KEY-----"* || "$DEPLOY_SSH_KEY" == *"-----BEGIN RSA PRIVATE KEY-----"* || "$DEPLOY_SSH_KEY" == *"-----BEGIN EC PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d '[:space:]' | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          fp="$(ssh-keygen -y -f "$key" 2>/dev/null | ssh-keygen -lf - | awk '{print $2}')"
          case "$fp" in
            SHA256:yZ0PY2OlUFSszk6GcX9R9DxA/ZWVFBQ8ecRpFBJz4NA|SHA256:5UUGhIltNpKwHnvln4NThvqhHUQ6O3ntmMuvS1Uiun4|SHA256:uT3cxt86sX2DOP7sI7Ku67r39Qsrwlx5SylBxoaW9Hw|SHA256:ZufQ/zpxkVWSj1pNE77vnLATiWfvyAT+1ZSzruClE48) ;;
            *) echo "::error::Unapproved SSH key"; exit 1 ;;
          esac
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          hostkey="$DEPLOY_HOST"; [[ "$DEPLOY_PORT" == 22 ]] || hostkey="[$DEPLOY_HOST]:$DEPLOY_PORT"
          ssh-keygen -F "$hostkey" -f "$RUNNER_TEMP/kargozar-ssh/known_hosts" >/dev/null
          cat > "$RUNNER_TEMP/kargozar-ssh/config" <<EOF
          Host staging
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile $key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $RUNNER_TEMP/kargozar-ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/config"
      - name: Check local API and inspect errors if needed
        shell: bash
        env:
          SSH_CONFIG: ${{ runner.temp }}/kargozar-ssh/config
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" staging 'bash -s' <<'REMOTE'
          set -u
          APP="$(readlink -f /var/www/kargozar-staging/current)"
          echo "=== Certbot process and certificate diagnostics ==="
          ps -eo pid,etime,stat,args | grep -E '[c]ertbot|[a]pt-get' || true
          echo "=== Terminate stale Certbot dry-run lock holder ==="
          sudo -n kill -9 9756 9753 2>/dev/null || true
          sleep 1
          ps -eo pid,etime,stat,args | grep -E '[c]ertbot|[a]pt-get' || true
          echo "=== API Nginx virtual host ==="
          sudo -n cat /etc/nginx/sites-enabled/api.barakmod.ir 2>&1 || true
          echo "=== Nginx API server blocks ==="
          sudo -n nginx -T 2>/dev/null | grep -n -B 8 -A 28 'server_name api.barakmod.ir' || true
          echo "=== Current release resolution ==="
          readlink -f /var/www/kargozar-staging/current
          readlink -f /var/www/kargozar-staging/current/public/index.php
          echo "=== PHP-FPM and OPcache configuration ==="
          sudo -n systemctl show php8.3-fpm -p MainPID -p ActiveEnterTimestamp
          sudo -n grep -R -n -E 'opcache\\.(file_cache|validate_timestamps|revalidate_freq)|realpath_cache_ttl' /etc/php/8.3/fpm 2>/dev/null || true
          sudo -n grep -n -E 'SCRIPT_FILENAME|DOCUMENT_ROOT' /etc/nginx/snippets/fastcgi-php.conf || true
          php -i | grep -E '^opcache.file_cache|^opcache.validate_timestamps|^realpath_cache_ttl' || true
          sudo -n certbot certificates 2>&1 || true
          echo | openssl s_client -connect 127.0.0.1:443 -servername api.barakmod.ir 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 || true
          echo "=== PHP-FPM runtime probe ==="
          probe="$APP/public/__kg_probe.php"
          trap 'rm -f "$probe"' EXIT
          cat > "$probe" <<'PHP'
          <?php
          header('Content-Type: text/plain; charset=utf-8');
          echo 'FILE='.__FILE__.PHP_EOL;
          echo 'REALPATH='.realpath(__DIR__).PHP_EOL;
          echo 'PHP='.PHP_VERSION.PHP_EOL;
          echo 'OPCACHE_VALIDATE='.ini_get('opcache.validate_timestamps').PHP_EOL;
          try {
              require dirname(__DIR__).'/vendor/autoload.php';
              $app = require dirname(__DIR__).'/bootstrap/app.php';
              $kernelClass = 'Illuminate\\Contracts\\Console\\Kernel';
              $app->make($kernelClass)->bootstrap();
              echo 'VIEW_COMPILED='.var_export(config('view.compiled'), true).PHP_EOL;
              echo 'VIEW_DIR='.(is_dir(config('view.compiled')) ? 'yes' : 'no').PHP_EOL;
              echo 'VIEW_WRITABLE='.(is_writable(config('view.compiled')) ? 'yes' : 'no').PHP_EOL;
          } catch (\\Throwable $e) {
              http_response_code(500);
              echo 'BOOTSTRAP_ERROR='.get_class($e).': '.$e->getMessage().PHP_EOL;
              echo $e->getFile().':'.$e->getLine().PHP_EOL;
          }
          PHP
          curl --resolve api.barakmod.ir:443:127.0.0.1 --max-time 15 -sS -D - https://api.barakmod.ir/__kg_probe.php || true
          rm -f "$probe"
          trap - EXIT
          echo "=== /up ==="
          UP="$(curl --max-time 15 -sS -o /tmp/kg-up.txt -w '%{http_code}' -H 'Host: api.barakmod.ir' http://127.0.0.1/up || true)"
          echo "HTTP_STATUS=$UP"
          cat /tmp/kg-up.txt 2>/dev/null || true
          echo
          echo "=== /api/v1/services ==="
          SV="$(curl --max-time 20 -sS -o /tmp/kg-services.txt -w '%{http_code}' -H 'Host: api.barakmod.ir' http://127.0.0.1/api/v1/services || true)"
          echo "HTTP_STATUS=$SV"
          head -c 1200 /tmp/kg-services.txt 2>/dev/null || true
          echo
          if [[ "$UP" != "200" || "$SV" != "200" ]]; then
            echo "=== Recent sanitized Laravel errors ==="
            if [[ -f "$APP/storage/logs/laravel.log" ]]; then
              sudo -n tail -n 120 "$APP/storage/logs/laravel.log" | grep -E 'ERROR|CRITICAL|production\.' | tail -n 35 | sed -E 's/((password|token|authorization|secret|api[_-]?key)[^:=]*[:=][[:space:]]*)[^ ,;]+/\1[REDACTED]/Ig' || true
            fi
            echo "=== Blade cache path and permissions ==="
            cd "$APP"
            printf 'APP=%s\n' "$APP"
            ls -ld "$APP/storage" "$APP/storage/framework" "$APP/storage/framework/views" "$APP/bootstrap/cache" 2>&1 || true
            readlink -f "$APP/storage" || true
            grep -E '^(VIEW_COMPILED_PATH|APP_ENV|APP_DEBUG)=' "$APP/.env" | sed -E 's/=.*/=[configured]/' || true
            php artisan tinker --execute="dump(config('view.compiled')); dump(is_dir(config('view.compiled'))); dump(is_writable(config('view.compiled')));" 2>&1 || true
            echo "=== Laravel log tail ==="
            sudo -n tail -n 220 "$APP/storage/logs/laravel.log" 2>/dev/null | tail -n 160 | sed -E 's/((password|token|authorization|secret|api[_-]?key)[^:=]*[:=][[:space:]]*)[^ ,;]+/\1[REDACTED]/Ig' || true
            echo "=== Recent PHP-FPM errors ==="
            sudo -n journalctl -u php8.3-fpm --no-pager -n 80 2>/dev/null || true
            echo "=== Nginx API error log ==="
            sudo -n tail -n 100 /var/log/nginx/api.barakmod.ir.error.log 2>/dev/null || true
            echo "=== Active Nginx root and FastCGI script path ==="
            sudo -n nginx -T 2>/dev/null | grep -E -n 'server_name api.barakmod.ir|root /var/www/kargozar-staging|SCRIPT_FILENAME|fastcgi_pass' | tail -n 40 || true
          fi
          REMOTE
      - name: External HTTPS checks
        shell: bash
        run: |
          set +e
          for endpoint in https://api.barakmod.ir/up https://api.barakmod.ir/api/v1/services; do
            echo "=== $endpoint ==="
            curl --connect-timeout 10 --max-time 25 -sS -D /tmp/kg-headers -o /tmp/kg-body -w 'HTTP_STATUS=%{http_code}\nSSL_VERIFY=%{ssl_verify_result}\n' "$endpoint"
            rc=$?
            echo "CURL_EXIT=$rc"
            sed -n '1,12p' /tmp/kg-headers
            head -c 1200 /tmp/kg-body
            echo
          done
