name: Build Laravel production bundle for cPanel

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/laravel-cpanel-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-production-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pcre, pdo, pdo_mysql, session, tokenizer, xml

      - name: Validate locked dependencies
        run: composer validate --strict

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Verify Laravel bootstrap and package discovery
        run: |
          test -f vendor/autoload.php
          test -f artisan
          php artisan package:discover --ansi

      - name: Create cPanel-ready archive
        run: |
          zip -r ../kargozar-laravel-production.zip . \
            -x ".env" ".env.*" "tests/*" "phpunit.xml" "node_modules/*" \
               "storage/logs/*" "storage/framework/cache/data/*"

      - name: Generate archive checksum
        working-directory: .
        run: sha256sum kargozar-laravel-production.zip > kargozar-laravel-production.zip.sha256

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: kargozar-laravel-production-bundle
          path: |
            kargozar-laravel-production.zip
            kargozar-laravel-production.zip.sha256
          if-no-files-found: error
          retention-days: 14
