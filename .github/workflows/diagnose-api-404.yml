name: Diagnose KarGozar API 404
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare approved SSH access
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing secret $name"; exit 1; }
          done
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 "$RUNNER_TEMP/kargozar-ssh"
          key="$RUNNER_TEMP/kargozar-ssh/id_key"
          if [[ "$DEPLOY_SSH_KEY" == *"-----BEGIN OPENSSH PRIVATE KEY-----"* || "$DEPLOY_SSH_KEY" == *"-----BEGIN RSA PRIVATE KEY-----"* || "$DEPLOY_SSH_KEY" == *"-----BEGIN EC PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d '[:space:]' | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          fp="$(ssh-keygen -y -f "$key" 2>/dev/null | ssh-keygen -lf - | awk '{print $2}')"
          case "$fp" in
            SHA256:yZ0PY2OlUFSszk6GcX9R9DxA/ZWVFBQ8ecRpFBJz4NA|SHA256:5UUGhIltNpKwHnvln4NThvqhHUQ6O3ntmMuvS1Uiun4|SHA256:uT3cxt86sX2DOP7sI7Ku67r39Qsrwlx5SylBxoaW9Hw|SHA256:ZufQ/zpxkVWSj1pNE77vnLATiWfvyAT+1ZSzruClE48) ;;
            *) echo "::error::Unapproved SSH key"; exit 1 ;;
          esac
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          hostkey="$DEPLOY_HOST"; [[ "$DEPLOY_PORT" == 22 ]] || hostkey="[$DEPLOY_HOST]:$DEPLOY_PORT"
          ssh-keygen -F "$hostkey" -f "$RUNNER_TEMP/kargozar-ssh/known_hosts" >/dev/null
          cat > "$RUNNER_TEMP/kargozar-ssh/config" <<EOF
          Host staging
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile $key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $RUNNER_TEMP/kargozar-ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/config"
      - name: Diagnose Laravel route registration and local HTTP responses
        shell: bash
        env:
          SSH_CONFIG: ${{ runner.temp }}/kargozar-ssh/config
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" staging 'bash -s' <<'REMOTE'
          set +e
          APP="/var/www/kargozar-staging/current"
          echo "=== Active release ==="
          readlink -f "$APP"
          echo
          echo "=== Laravel route list for API services ==="
          cd "$APP"
          php artisan route:list --path=api/v1/services -v 2>&1 | head -100
          echo "ROUTE_LIST_EXIT=${PIPESTATUS[0]}"
          echo
          echo "=== Route list API overview ==="
          php artisan route:list --path=api/v1 2>&1 | head -100
          echo
          echo "=== Public entrypoint and route files ==="
          ls -l public/index.php routes/api.php bootstrap/app.php
          echo
          echo "=== Laravel health endpoint via API host ==="
          curl --max-time 12 -sS -i -H 'Host: api.barakmod.ir' http://127.0.0.1/up | head -30
          echo
          echo "=== API services endpoint via API host ==="
          curl --max-time 12 -sS -i -H 'Host: api.barakmod.ir' http://127.0.0.1/api/v1/services | head -50
          echo
          echo "=== Recent API Nginx error log ==="
          sudo -n tail -40 /var/log/nginx/api.barakmod.ir.error.log 2>&1
          echo
          echo "=== Laravel recent log tail (redacted patterns only) ==="
          if [ -f storage/logs/laravel.log ]; then
            tail -80 storage/logs/laravel.log | sed -E 's/(password|token|secret|authorization)[^,]*/\1=[REDACTED]/Ig' | tail -50
          else
            echo "No Laravel log file found"
          fi
          REMOTE
