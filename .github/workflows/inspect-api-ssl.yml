name: Inspect API Nginx and SSL readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kargozar-api-ssl-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only API TLS and Nginx inspection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate deployment secrets and prepare SSH
        id: ssh
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          if ! [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "::error::DEPLOY_HOST must be a hostname or IP without scheme/port."
            exit 1
          fi
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          if ! [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || (( DEPLOY_PORT < 1 || DEPLOY_PORT > 65535 )); then
            echo "::error::DEPLOY_PORT is invalid."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/kargozar-ssh"
          key_file="$RUNNER_TEMP/kargozar-ssh/id_key"
          if [[ "$DEPLOY_SSH_KEY" == *"-----BEGIN OPENSSH PRIVATE KEY-----"* || "$DEPLOY_SSH_KEY" == *"-----BEGIN RSA PRIVATE KEY-----"* || "$DEPLOY_SSH_KEY" == *"-----BEGIN EC PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$key_file"
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d '[:space:]' | base64 --decode > "$key_file"
          fi
          chmod 600 "$key_file"
          public_key="$(ssh-keygen -y -f "$key_file" 2>/dev/null)"
          fingerprint="$(printf '%s\n' "$public_key" | ssh-keygen -lf - | awk '{print $2}')"
          case "$fingerprint" in
            SHA256:yZ0PY2OlUFSszk6GcX9R9DxA/ZWVFBQ8ecRpFBJz4NA|SHA256:5UUGhIltNpKwHnvln4NThvqhHUQ6O3ntmMuvS1Uiun4|SHA256:uT3cxt86sX2DOP7sI7Ku67r39Qsrwlx5SylBxoaW9Hw|SHA256:ZufQ/zpxkVWSj1pNE77vnLATiWfvyAT+1ZSzruClE48) ;;
            *) echo "::error::SSH key fingerprint is not an approved staging key."; exit 1 ;;
          esac
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          host_key="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != "22" ]]; then host_key="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          ssh-keygen -F "$host_key" -f "$RUNNER_TEMP/kargozar-ssh/known_hosts" >/dev/null
          cat > "$RUNNER_TEMP/kargozar-ssh/config" <<EOF
          Host kargozar-staging
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile $key_file
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $RUNNER_TEMP/kargozar-ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/config"
          echo "ssh_config=$RUNNER_TEMP/kargozar-ssh/config" >> "$GITHUB_OUTPUT"

      - name: Inspect Nginx, Certbot, PHP-FPM and API host
        shell: bash
        env:
          SSH_CONFIG: ${{ steps.ssh.outputs.ssh_config }}
        run: |
          set -euo pipefail
          ssh -F "$SSH_CONFIG" kargozar-staging 'bash -s' <<'REMOTE'
          set -u
          echo "=== Host and permissions ==="
          id
          if sudo -n true 2>/dev/null; then
            echo "NONINTERACTIVE_SUDO=available"
          else
            echo "NONINTERACTIVE_SUDO=unavailable"
          fi
          echo
          echo "=== Nginx and Certbot versions ==="
          nginx -v 2>&1 || true
          if command -v certbot >/dev/null 2>&1; then
            certbot --version 2>&1 || true
            if sudo -n certbot plugins 2>/dev/null | grep -qi nginx; then
              echo "CERTBOT_NGINX_PLUGIN=available"
            else
              echo "CERTBOT_NGINX_PLUGIN=not-detected"
            fi
          else
            echo "CERTBOT=not-installed"
          fi
          echo
          echo "=== PHP-FPM sockets ==="
          find /run/php -maxdepth 1 -type s -printf '%f\n' 2>/dev/null | sort || true
          echo
          echo "=== Relevant Nginx directives for api.barakmod.ir (no secrets/private keys) ==="
          if sudo -n nginx -T 2>/dev/null | awk '
            /server[[:space:]]*\{/ { active=1; depth=0; block="" }
            active {
              block = block $0 "\n"
              opens = gsub(/\{/, "{")
              closes = gsub(/\}/, "}")
              depth += opens - closes
              if (depth == 0) {
                if (block ~ /server_name[^;]*api\.barakmod\.ir/) {
                  print block
                }
                active=0
                block=""
              }
            }
          ' | grep -E 'server_name|listen[[:space:]]|root[[:space:]]|ssl_certificate[[:space:]]|include[[:space:]]' | sed -E 's/^[[:space:]]+//' ; then
            :
          else
            echo "API_SERVER_BLOCK_NOT_FOUND_OR_NGINX_CONFIG_NOT_READABLE"
          fi
          echo
          echo "=== Nginx config validation ==="
          if sudo -n nginx -t 2>&1; then echo "NGINX_CONFIG=valid"; else echo "NGINX_CONFIG=not-valid-or-sudo-unavailable"; fi
          echo
          echo "=== Local HTTP/HTTPS response codes ==="
          curl --max-time 8 -sS -o /dev/null -w 'HTTP_LOCAL=%{http_code}\n' -H 'Host: api.barakmod.ir' http://127.0.0.1/ || true
          curl --max-time 8 -k -sS -o /dev/null -w 'HTTPS_LOCAL=%{http_code}\n' --resolve api.barakmod.ir:443:127.0.0.1 https://api.barakmod.ir/ || true
          echo
          echo "=== Public DNS resolution ==="
          getent ahostsv4 api.barakmod.ir | awk '!seen[$1]++ {print $1}' | head -3 || true
          REMOTE
