name: Kargozar remote admin
# Default push task is read-only health inspection
# Verify latest support portal deployment and polling endpoint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kargozar-remote-admin.yml"
  workflow_dispatch:
    inputs:
      task:
        description: "Choose a restricted server diagnostics or maintenance task"
        required: true
        type: choice
        options:
          - health
          - system
          - routes
          - migrations
          - storage
          - logo-export
          - logo-locate
          - palette-locate
          - palette-export
          - cache-clear
          - rollback
        default: health

permissions:
  contents: write

concurrency:
  group: kargozar-staging-admin
  cancel-in-progress: false

jobs:
  remote-admin:
    name: Run approved restricted server task
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SSH configuration
        id: ssh
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo "::error::Invalid host"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]] || { echo "::error::Invalid user"; exit 1; }
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo "::error::Invalid port"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] && [[ "$DEPLOY_PATH" != "/" ]] && [[ "$DEPLOY_PATH" != *"/../"* ]] && [[ "$DEPLOY_PATH" != */.. ]] || { echo "::error::Invalid deploy path"; exit 1; }

          install -d -m 700 "$RUNNER_TEMP/kargozar-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/kargozar-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/kargozar-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/"*
          target="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != "22" ]]; then target="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          ssh-keygen -F "$target" -f "$RUNNER_TEMP/kargozar-ssh/known_hosts" >/dev/null || { echo "::error::Pinned host key mismatch"; exit 1; }
          cat > "$RUNNER_TEMP/kargozar-ssh/config" <<EOF
          Host kargozar-staging
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile $RUNNER_TEMP/kargozar-ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $RUNNER_TEMP/kargozar-ssh/known_hosts
            ConnectTimeout 15
          EOF
          chmod 600 "$RUNNER_TEMP/kargozar-ssh/config"
          echo "deploy_path=$DEPLOY_PATH" >> "$GITHUB_OUTPUT"
          echo "ssh_config=$RUNNER_TEMP/kargozar-ssh/config" >> "$GITHUB_OUTPUT"

      - name: Run selected restricted task
        shell: bash
        env:
          SSH_CONFIG: ${{ steps.ssh.outputs.ssh_config }}
          DEPLOY_PATH: ${{ steps.ssh.outputs.deploy_path }}
          TASK: ${{ inputs.task || 'health' }}
        run: |
          set -euo pipefail
          case "$TASK" in
            health)
              REMOTE_COMMAND='
              set -eu
              cd "$1/current"
              php artisan about --only=environment
              printf "\\n=== MIGRATION STATUS ===\\n"
              php artisan migrate:status
              printf "\\n=== SUPPORT API ROUTES ===\\n"
              php artisan route:list --path=api/v1
              printf "\\n=== STAFF PORTAL ROUTES ===\\n"
              php artisan route:list --path=staff/portal
              printf "\\n=== API VHOST CONFIGURATION ===\\n"
              if sudo -n nginx -T 2>/dev/null | grep -nE "server_name[^;]*api\\.barakmod\\.ir|ssl_certificate|root /var/www/kargozar-staging/current/public"; then :; else echo "No readable matching API vhost found (or nginx config is not readable)."; fi
              printf "\\n=== CERTBOT AVAILABILITY ===\\n"
              if command -v certbot >/dev/null 2>&1; then sudo -n certbot certificates 2>&1 || echo "Cannot read certbot certificates without elevated access."; else echo "certbot is not installed."; fi
              printf "\\n=== LOCAL API ROUTE ===\\n"
              curl --silent --show-error --max-time 10 -H "Host: api.barakmod.ir" -o /tmp/kargozar-api-local-check.txt -w "HTTP %{http_code}\\n" http://127.0.0.1/api/v1/services || true
              head -c 500 /tmp/kargozar-api-local-check.txt 2>/dev/null || true
              '
              ;;
            system)
              REMOTE_COMMAND='printf "HOST: "; hostname; printf "\\nUPTIME: "; uptime; printf "\\nMEMORY:\\n"; free -h; printf "\\nDISK:\\n"; df -h "$1"; printf "\\nSERVICES:\\n"; for svc in nginx mysql php8.3-fpm; do state="$(systemctl is-active "$svc" 2>/dev/null || true)"; printf "%-12s %s\\n" "$svc" "${state:-unknown}"; done; printf "\\nCURRENT RELEASE: "; readlink "$1/current"'
              ;;
            routes)
              REMOTE_COMMAND='cd "$1/current" && php artisan route:list --path=api'
              ;;
            migrations)
              REMOTE_COMMAND='cd "$1/current" && php artisan migrate:status'
              ;;
            logo-locate)
              REMOTE_COMMAND='find /var/www /home /srv /opt /var/lib/sftpgo /var/lib -type f -name "Picsart_26-11-20_20-13-50-129.jpg" -print 2>/dev/null | head -20'
              ;;
            palette-locate)
              REMOTE_COMMAND='find /var/www /home /srv /opt /var/lib/sftpgo /var/lib -type f -iname "Sazmani-kargozar*" -print 2>/dev/null | head -20'
              ;;
            palette-export)
              REMOTE_COMMAND='find /var/www /home /srv /opt /var/lib/sftpgo /var/lib -type f -iname "Sazmani-kargozar*" -print -quit 2>/dev/null'
              ;;
            logo-export)
              REMOTE_COMMAND='test -s /var/www/html/kargozar-assets/final/Picsart_26-11-20_20-13-50-129.jpg && file /var/www/html/kargozar-assets/final/Picsart_26-11-20_20-13-50-129.jpg && sha256sum /var/www/html/kargozar-assets/final/Picsart_26-11-20_20-13-50-129.jpg /var/www/html/kargozar-assets/Picsart_26-11-20_20-13-50-129.jpg'
              ;;
            storage)
              REMOTE_COMMAND='printf "current=%s\\n" "$(readlink "$1/current")"; test -f "$1/current/artisan"; test -d "$1/current/vendor"; test -d "$1/shared/storage"; stat -c "%U:%G %a %n" "$1/shared/.env" "$1/shared/storage"'
              ;;
            cache-clear)
              REMOTE_COMMAND='cd "$1/current" && php artisan optimize:clear'
              ;;
            rollback)
              REMOTE_COMMAND='set -euo pipefail
              deploy_root="$1"
              previous_file="$deploy_root/shared/.previous-release"
              test -f "$previous_file" || { echo "No previous release record"; exit 1; }
              target="$(cat "$previous_file")"
              case "$target" in "$deploy_root"/releases/*) ;; *) echo "Previous release path rejected"; exit 1 ;; esac
              target_real="$(realpath -e "$target")"
              releases_real="$(realpath -e "$deploy_root/releases")"
              case "$target_real" in "$releases_real"/*) ;; *) echo "Previous release is outside releases directory"; exit 1 ;; esac
              test -f "$target_real/artisan" && test -d "$target_real/vendor" || { echo "Previous release is incomplete"; exit 1; }
              current_target="$(readlink "$deploy_root/current")"
              case "$current_target" in "$deploy_root"/releases/*) ;; *) echo "Current release path rejected"; exit 1 ;; esac
              current_real="$(realpath -e "$current_target")"
              original_previous="$(cat "$previous_file")"
              ln -sfn "$target_real" "$deploy_root/current.next"
              mv -Tf "$deploy_root/current.next" "$deploy_root/current"
              printf "%s\\n" "$current_real" > "$previous_file"
              if ! (cd "$deploy_root/current" && php artisan about --only=environment); then
                ln -sfn "$current_real" "$deploy_root/current.rollback"
                mv -Tf "$deploy_root/current.rollback" "$deploy_root/current"
                printf "%s\\n" "$original_previous" > "$previous_file"
                echo "Rollback health check failed; restored original release"
                exit 1
              fi
              echo "Rollback completed and application health check passed"'
              ;;
            *)
              echo "::error::Unsupported task"
              exit 1
              ;;
          esac
          ssh -F "$SSH_CONFIG" kargozar-staging "bash -lc $(printf '%q' "$REMOTE_COMMAND") -- $(printf '%q' "$DEPLOY_PATH")"

      - name: Download uploaded Kargozar logo
        if: inputs.task == 'logo-export'
        shell: bash
        env:
          SSH_CONFIG: ${{ steps.ssh.outputs.ssh_config }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kargozar-logo"
          scp -F "$SSH_CONFIG" kargozar-staging:/var/www/html/kargozar-assets/final/Picsart_26-11-20_20-13-50-129.jpg "$RUNNER_TEMP/kargozar-logo/kargozar-logo-original.jpg"
          test -s "$RUNNER_TEMP/kargozar-logo/kargozar-logo-original.jpg"
          file "$RUNNER_TEMP/kargozar-logo/kargozar-logo-original.jpg"
          sha256sum "$RUNNER_TEMP/kargozar-logo/kargozar-logo-original.jpg"

      - name: Prepare and commit app brand assets
        if: inputs.task == 'logo-export'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/kargozar-icon-venv"
          "$RUNNER_TEMP/kargozar-icon-venv/bin/pip" install --quiet Pillow
          "$RUNNER_TEMP/kargozar-icon-venv/bin/python" mobile/tool/prepare_brand_assets.py "$RUNNER_TEMP/kargozar-logo/kargozar-logo-original.jpg" mobile/assets/brand
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/brand
          if git diff --cached --quiet; then
            echo "Brand assets are already up to date."
            exit 0
          fi
          git commit -m "Add Kargozar app and Myket icon assets"
          git push origin HEAD:main

      - name: Upload original logo artifact
        if: inputs.task == 'logo-export'
        uses: actions/upload-artifact@v4
        with:
          name: kargozar-logo-original
          path: |
            mobile/assets/brand/kargozar-logo-original.jpg
            mobile/assets/brand/myket-store-icon-512.png
            mobile/assets/brand/app-icon-master-1024.png
            mobile/assets/brand/android-adaptive-foreground.png
            mobile/assets/brand/android-adaptive-monochrome.png
          if-no-files-found: error
          retention-days: 7

      - name: Export approved corporate color guide during release review
        if: github.event_name == 'push'
        shell: bash
        env:
          SSH_CONFIG: ${{ steps.ssh.outputs.ssh_config }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kargozar-palette"
          remote_path="$(ssh -F "$SSH_CONFIG" kargozar-staging 'find /var/www /home /srv /opt /var/lib/sftpgo /var/lib -type f -iname "Sazmani-kargozar*" -print -quit 2>/dev/null')"
          if [[ -z "$remote_path" ]]; then
            echo "Approved corporate color guide not found on VPS; keep existing restrained brand palette and do not guess color codes."
            exit 0
          fi
          scp -F "$SSH_CONFIG" "kargozar-staging:$remote_path" "$RUNNER_TEMP/kargozar-palette/Sazmani-kargozar"
          test -s "$RUNNER_TEMP/kargozar-palette/Sazmani-kargozar"

      - name: Upload approved corporate color guide for review
        if: github.event_name == 'push' && hashFiles(format('{0}/kargozar-palette/Sazmani-kargozar', runner.temp)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: kargozar-approved-brand-guide
          path: ${{ runner.temp }}/kargozar-palette/Sazmani-kargozar
          if-no-files-found: ignore
          retention-days: 7

      - name: Download corporate color guide
        if: inputs.task == 'palette-export'
        shell: bash
        env:
          SSH_CONFIG: ${{ steps.ssh.outputs.ssh_config }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kargozar-palette"
          remote_path="$(ssh -F "$SSH_CONFIG" kargozar-staging 'find /var/www /home /srv /opt /var/lib/sftpgo /var/lib -type f -iname "Sazmani-kargozar*" -print -quit 2>/dev/null')"
          if [[ -z "$remote_path" ]]; then
            echo "::error::Sazmani-kargozar file was not found on the server"
            exit 1
          fi
          printf 'Found corporate guide: %s\n' "$remote_path"
          scp -F "$SSH_CONFIG" "kargozar-staging:$remote_path" "$RUNNER_TEMP/kargozar-palette/Sazmani-kargozar"
          test -s "$RUNNER_TEMP/kargozar-palette/Sazmani-kargozar"
          file "$RUNNER_TEMP/kargozar-palette/Sazmani-kargozar"

      - name: Upload corporate color guide artifact
        if: inputs.task == 'palette-export'
        uses: actions/upload-artifact@v4
        with:
          name: kargozar-corporate-color-guide
          path: ${{ runner.temp }}/kargozar-palette/Sazmani-kargozar
          if-no-files-found: error
          retention-days: 7
