name: Build KarGozar Android app

on:
  # APK/AAB builds are manual only. Mobile source changes run mobile-ci.yml.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=kargozar_mobile --org=ir.kargozar .

      - name: Configure Android application identity
        run: python3 tool/configure_android_app.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze lib --no-fatal-infos

      - name: Test API client
        run: flutter test

      - name: Build debug APK
        env:
          KARGOZAR_API_BASE_URL: ${{ vars.KARGOZAR_API_BASE_URL || 'https://api.barakmod.ir' }}
          KARGOZAR_ASSETS_BASE_URL: ${{ vars.KARGOZAR_ASSETS_BASE_URL }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$KARGOZAR_API_BASE_URL" --dart-define=KARGOZAR_ASSETS_BASE_URL="$KARGOZAR_ASSETS_BASE_URL"

      - name: Upload Myket store listing icon
        uses: actions/upload-artifact@v4
        with:
          name: kargozar-myket-store-icon
          path: mobile/assets/brand/myket-store-icon-512.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kargozar-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure private release signing
        id: signing
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_SIGNING_BUNDLE_BASE64" ]]; then
            echo "Release signing secret is not configured; skipping signed release build."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_SIGNING_BUNDLE_BASE64" | base64 --decode > /tmp/kargozar-signing-bundle.zip
          unzip -o /tmp/kargozar-signing-bundle.zip -d .
          test -s android/app/upload-keystore.jks
          test -s android/key.properties
          python3 tool/configure_android_signing.py
          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK and App Bundle
        if: steps.signing.outputs.release_ready == 'true'
        env:
          KARGOZAR_API_BASE_URL: ${{ vars.KARGOZAR_API_BASE_URL || 'https://api.barakmod.ir' }}
          KARGOZAR_ASSETS_BASE_URL: ${{ vars.KARGOZAR_ASSETS_BASE_URL }}
        run: |
          flutter build apk --release --dart-define=API_BASE_URL="$KARGOZAR_API_BASE_URL" --dart-define=KARGOZAR_ASSETS_BASE_URL="$KARGOZAR_ASSETS_BASE_URL"
          flutter build appbundle --release --dart-define=API_BASE_URL="$KARGOZAR_API_BASE_URL" --dart-define=KARGOZAR_ASSETS_BASE_URL="$KARGOZAR_ASSETS_BASE_URL"

      - name: Verify signed APK and package identity
        if: steps.signing.outputs.release_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -s "$APK"
          test -s "$AAB"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          jarsigner -verify "$AAB" >/dev/null

      - name: Upload signed release artifacts
        if: steps.signing.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kargozar-android-release
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
