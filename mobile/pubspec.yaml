name: kargozar_mobile
description: Customer app for Kargozar business services.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/kargozar/

flutter_launcher_icons:
  android: true
  image_path: assets/brand/myket-store-icon-512.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/android-adaptive-foreground.png
  adaptive_icon_monochrome: assets/brand/android-adaptive-monochrome.png
  min_sdk_android: 21
